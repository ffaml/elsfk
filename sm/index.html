
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限堆叠俄罗斯方块</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* 防止滚动 */
        }
        .game-container {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #16213e;
        }
        .btn {
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* 移动端控制按钮样式 */
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- 头部信息 -->
    <div class="absolute top-4 w-full max-w-md px-4 flex justify-between items-center z-10">
        <div>
          	
            <p class="text-xs text-gray-400">俄罗斯方块</p>
        </div>
        <div class="text-right">
            <div class="text-sm text-gray-400">分数</div>
            <div id="score" class="text-xl font-mono font-bold text-white">0</div>
        </div>
    </div>

    <!-- 游戏主区域 -->
    <div class="relative game-container border-4 border-indigo-900/50">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <!-- 暂停/开始遮罩 -->
        <div id="overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-20">
            <h2 id="overlay-title" class="text-3xl font-bold mb-4 text-white">准备开始</h2>
            <button id="start-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-full btn shadow-lg shadow-indigo-500/50">
                <i class="fa-solid fa-play mr-2"></i>开始游戏
            </button>
            <p class="mt-4 text-sm text-gray-400">按空格键暂停/继续</p>
        </div>
    </div>

    <!-- 移动端控制区 (仅在小屏幕显示) -->
    <div class="md:hidden absolute bottom-8 w-full max-w-xs px-4 grid grid-cols-3 gap-4 z-10">
        <div class="col-start-2 flex justify-center">
            <button id="btn-rotate" class="control-btn w-14 h-14 rounded-full flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
        <div class="col-start-1 row-start-2 flex justify-center">
            <button id="btn-left" class="control-btn w-14 h-14 rounded-full flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
        <div class="col-start-2 row-start-2 flex justify-center">
            <button id="btn-down" class="control-btn w-14 h-14 rounded-full flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
        </div>
        <div class="col-start-3 row-start-2 flex justify-center">
            <button id="btn-right" class="control-btn w-14 h-14 rounded-full flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- 桌面端提示 -->
    <div class="hidden md:block absolute bottom-8 text-gray-500 text-sm">
        <span class="mx-2"><kbd class="bg-gray-800 px-2 py-1 rounded">←</kbd> 左移</span>
        <span class="mx-2"><kbd class="bg-gray-800 px-2 py-1 rounded">→</kbd> 右移</span>
        <span class="mx-2"><kbd class="bg-gray-800 px-2 py-1 rounded">↑</kbd> 旋转</span>
        <span class="mx-2"><kbd class="bg-gray-800 px-2 py-1 rounded">↓</kbd> 加速</span>
        <span class="mx-2"><kbd class="bg-gray-800 px-2 py-1 rounded">Space</kbd> 暂停</span>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');

        // 放大倍数，让像素块看起来更大
        context.scale(20, 20);

        // 游戏状态
        let isPaused = true;
        let isGameOver = false; // 虽然去掉了堆满结束，但保留变量结构以防后续扩展
        let score = 0;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        // 方块形状定义
        const pieces = 'ILJOTSZ';
        const colors = [
            null,
            '#FF0D72', // T - Magenta
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Green
            '#F538FF', // Z - Purple (Custom)
            '#FF8E0D', // L - Orange
            '#FFE138', // O - Yellow
            '#3877FF', // J - Blue
        ];

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // 创建矩阵
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // 游戏场地矩阵 (12宽 x 20高)
        const arena = createMatrix(12, 20);

        // 玩家对象
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
        };

        // 绘制函数
        function draw() {
            // 清空画布
            context.fillStyle = '#16213e';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制已固定的方块
            drawMatrix(arena, {x: 0, y: 0});
            // 绘制当前下落的方块
            drawMatrix(player.matrix, player.pos);
        }

        // 绘制矩阵通用函数
        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // 绘制方块主体
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // 绘制方块高光/边框效果，增加立体感
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // 内部阴影
                        context.fillStyle = 'rgba(0, 0, 0, 0.1)';
                        context.fillRect(x + offset.x + 0.1, y + offset.y + 0.8, 0.8, 0.1);
                        context.fillRect(x + offset.x + 0.8, y + offset.y + 0.1, 0.1, 0.8);
                    }
                });
            });
        }

        // 合并方块到场地
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // 关键修改：允许方块堆叠超出顶部边界
                        // 只有当 y + player.pos.y 在 arena 范围内时才写入
                        // 如果超出顶部（负数索引），JS数组会自动忽略或报错，这里我们只渲染可见部分
                        // 但为了逻辑简单，我们允许写入，只是不检测顶部的碰撞作为游戏结束条件
                        
                        const boardY = y + player.pos.y;
                        const boardX = x + player.pos.x;

                        // 确保不越界左右和底部
                        if (boardY >= 0 && boardY < arena.length && boardX >= 0 && boardX < arena[0].length) {
                            arena[boardY][boardX] = value;
                        }
                    }
                });
            });
        }

        // 旋转矩阵
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // 玩家旋转
        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            // 墙踢（Wall Kick）简单实现：如果旋转后碰撞，尝试左右移动
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix.length) {
                    rotate(player.matrix, -dir); // 无法旋转，恢复原状
                    player.pos.x = pos;
                    return;
                }
            }
        }

        // 碰撞检测
        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 消除行
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        // 重置/生成新方块
        function playerReset() {
            const piecesStr = 'ILJOTSZ';
            player.matrix = createPiece(piecesStr[piecesStr.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix.length / 2 | 0);

            // 【核心修改点】：移除游戏结束逻辑
            // 原本这里会检查 collide(arena, player)，如果为真则重置 arena 并 Game Over
            // 现在即使新生成的方块一出来就碰撞（因为下面堆满了），我们也允许它存在
            // 或者更简单的处理：如果生成时就碰撞，说明已经堆到顶了，但在“无限模式”下，
            // 我们可以选择不重置，或者仅仅让新方块无法移动。
            // 为了视觉上不穿帮，如果生成即碰撞，我们通常还是得做点什么。
            // 但既然要求“去掉堆满屏幕逻辑”，最彻底的做法是：
            // 1. 不检测顶部碰撞导致 Game Over。
            // 2. 如果新方块生成位置被占用，强制将其向下推直到空闲位置，或者直接覆盖（不太合理）。
            
            // 这里采用策略：如果生成时碰撞，说明堆到了顶。在经典俄罗斯方块中这是结束。
            // 在无限模式中，我们可以简单地不重置游戏，而是让玩家继续操作（如果能动的话）。
            // 但如果完全动不了，体验会很差。
            // 另一种常见的“无限”实现是：当堆到顶时，自动消除最上面的一行或者整体下移？
            // 不，用户只说“去掉堆满屏幕去掉这个逻辑”，通常指不要 Game Over。
            // 所以：如果 collide 为真，我们不重置 arena，也不重置分数。
            // 但为了防止新方块卡在墙里，我们尝试向下寻找空位。
            
            if (collide(arena, player)) {
                // 尝试向下移动直到不碰撞
                while(collide(arena, player)) {
                    player.pos.y++;
                    // 如果到底部还碰撞，那真的没办法了，但这在逻辑上很难发生除非全屏都是方块且没有空隙
                    if (player.pos.y > arena.length) break; 
                }
                // 如果还是碰撞（极端情况），那就让它卡在那吧，或者稍微向上提一点渲染层？
                // 简单起见，如果向下找也找不到位置，就保持在 y=0，允许渲染溢出（如果canvas支持）
                // 但由于我们的 arena 是固定数组，溢出部分不会被绘制也不会被检测。
                // 所以最好的“无限”体验其实是：当堆到顶时，不再产生新方块？不，那样游戏就停了。
                
                // 修正策略：既然去掉了 Game Over，那么当新方块生成即碰撞时，
                // 我们依然生成它，哪怕它卡在顶部。玩家可以尝试旋转或移动它进入空隙。
                // 如果完全动不了，那就算是一种“软锁定”，但不重置分数。
                
                // 为了确保至少能看见，如果 y=0 处碰撞，我们不做任何重置操作。
            }
        }

        // 玩家下落
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--; // 撤销移动
                merge(arena, player); // 固定方块
                playerReset(); // 生成新方块
                arenaSweep(); // 检查消行
                updateScore();
            }
            dropCounter = 0;
        }

        // 玩家移动
        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        // 更新分数显示
        function updateScore() {
            scoreElement.innerText = player.score;
        }

        // 游戏主循环
        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        // 键盘事件监听
        document.addEventListener('keydown', event => {
            if (isPaused && event.keyCode !== 32) return; // 暂停时只响应空格

            if (event.keyCode === 37) { // Left
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right
                playerMove(1);
            } else if (event.keyCode === 40) { // Down
                playerDrop();
            } else if (event.keyCode === 38) { // Up (Rotate)
                playerRotate(1);
            } else if (event.keyCode === 32) { // Space (Pause/Resume)
                togglePause();
            }
        });

        // 触摸/按钮控制
        document.getElementById('btn-left').addEventListener('click', () => playerMove(-1));
        document.getElementById('btn-right').addEventListener('click', () => playerMove(1));
        document.getElementById('btn-down').addEventListener('click', () => playerDrop());
        document.getElementById('btn-rotate').addEventListener('click', () => playerRotate(1));

        // 暂停/开始控制
        function togglePause() {
            isPaused = !isPaused;
            if (!isPaused) {
                overlay.classList.add('hidden');
                lastTime = performance.now(); // 重置时间防止跳帧
                update();
            } else {
                overlay.classList.remove('hidden');
                overlayTitle.innerText = "已暂停";
                startBtn.innerHTML = '<i class="fa-solid fa-play mr-2"></i>继续游戏';
            }
        }

        startBtn.addEventListener('click', () => {
            if (overlayTitle.innerText === "准备开始" || overlayTitle.innerText === "已暂停") {
                 // 如果是第一次开始，初始化
                 if (player.matrix === null) {
                     playerReset();
                 }
                 togglePause();
            }
        });

        // 初始绘制一次背景
        draw();

    </script>
</body>
</html>
